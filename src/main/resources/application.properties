spring.application.name=analyse

# PostgreSQL datasource
# Set DB_URL, DB_USER, DB_PASSWORD as environment variables (or via -D system properties).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/geotracker}
spring.datasource.username=${DB_USER:geotracker}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
